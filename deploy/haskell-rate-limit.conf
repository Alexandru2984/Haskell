# Install in /etc/nginx/conf.d; relies on the server's existing trusted real-IP setup.
map $request_method $haskell_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=haskell_read:1m rate=10r/s;
limit_req_zone $haskell_write_key zone=haskell_write:1m rate=30r/m;
