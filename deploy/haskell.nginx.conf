server {
    listen 80;
    listen [::]:80;
    server_name haskell.micutu.com;


    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    access_log /var/log/nginx/haskell-canary.access.log;
    error_log /var/log/nginx/haskell-canary.error.log warn;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haskell.micutu.com;


    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    access_log /var/log/nginx/haskell-canary.access.log;
    error_log /var/log/nginx/haskell-canary.error.log warn;
    server_tokens off;
    client_max_body_size 128k;

    set $haskell_origin_allowed $from_cloudflare_origin;
    if ($haskell_origin_allowed = 0) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/haskell.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haskell.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:haskell_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /robots.txt {
        alias /srv/canary/haskell.micutu.com/app/releases/current/public/robots.txt;
        access_log off;
        log_not_found off;
    }

    location / {
        limit_req zone=haskell_read burst=30 nodelay;
        limit_req zone=haskell_write burst=10 nodelay;
        limit_req_status 429;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
